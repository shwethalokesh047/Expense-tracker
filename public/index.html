<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>💰 Expense Tracker</h1>
    <p>Track, filter and analyse your spending</p>
  </header>

  <main class="container">
    <!-- Summary cards -->
    <section class="cards">
      <div class="card"><span>Total Spent</span><strong id="totalAmount">₹0.00</strong></div>
      <div class="card"><span>Transactions</span><strong id="totalCount">0</strong></div>
      <div class="card"><span>Top Category</span><strong id="topCategory">—</strong></div>
    </section>

    <div class="grid">
      <!-- Add / Edit form -->
      <section class="panel">
        <h2 id="formTitle">Add Expense</h2>
        <form id="expenseForm" novalidate>
          <input type="hidden" id="expenseId" />

          <label for="title">Title</label>
          <input type="text" id="title" placeholder="e.g. Lunch at canteen" maxlength="100" required />

          <div class="row">
            <div>
              <label for="amount">Amount (₹)</label>
              <input type="number" id="amount" placeholder="0.00" min="0.01" step="0.01" required />
            </div>
            <div>
              <label for="date">Date</label>
              <input type="date" id="date" required />
            </div>
          </div>

          <label for="category">Category</label>
          <select id="category"></select>

          <label for="note">Note (optional)</label>
          <textarea id="note" rows="2" maxlength="250" placeholder="Any extra details"></textarea>

          <p id="formError" class="error" role="alert"></p>

          <div class="btn-row">
            <button type="submit" id="submitBtn" class="btn primary">Add Expense</button>
            <button type="button" id="cancelBtn" class="btn ghost hidden">Cancel</button>
          </div>
        </form>

        <h2 class="mt">Spending by Category</h2>
        <div id="chart" class="chart"><p class="muted">No data yet.</p></div>
      </section>

      <!-- List + filters -->
      <section class="panel">
        <h2>Expenses</h2>
        <div class="filters">
          <input type="text" id="search" placeholder="Search title…" />
          <select id="filterCategory"></select>
          <input type="month" id="filterMonth" />
          <button id="clearFilters" class="btn ghost small" type="button">Clear</button>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Date</th><th>Title</th><th>Category</th><th class="right">Amount</th><th class="right">Actions</th></tr>
            </thead>
            <tbody id="expenseBody"></tbody>
          </table>
        </div>
        <p id="emptyMsg" class="muted center hidden">No expenses found.</p>
      </section>
    </div>
  </main>

  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
